services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: fiap_games
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-api:
    build:
      context: ./src/FiapGames.Catalog.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Postgres__Host: postgres
      Postgres__Port: "5432"
      Postgres__Database: fiap_games
      Postgres__Username: catalog_role
      Postgres__Password: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD must be set}
      Postgres__SearchPath: catalog
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set}
      Jwt__Issuer: FiapGames
      Jwt__Audience: FiapGames.Client
      Jwt__ExpiryMinutes: "60"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
